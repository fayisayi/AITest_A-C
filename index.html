<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Level up o autoplay</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEECFF;--panel:#FFFFFF;--ink:#1B1A44;--mute:#5B5990;--line:#B7B3F0;--pink:#D81B60;--cyan:#0B7D8A;--good:#12803F;--bad:#C62828;--amber:#8A5F00;--gold:#B8860B;--btn:#2B2A6B;--btnink:#FFFFFF;--warn:#FFE9E9;--lt:#FFF3D6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17163A;--panel:#24235A;--ink:#EDEBFF;--mute:#B1AEE6;--line:#4B49A0;--pink:#FF6B96;--cyan:#38D6E5;--good:#5BE08A;--bad:#FF8A8A;--amber:#FFC93C;--gold:#FFC93C;--btn:#FFC93C;--btnink:#17163A;--warn:#3D1F4F;--lt:#3A3320}}
:root[data-theme="dark"]{--bg:#17163A;--panel:#24235A;--ink:#EDEBFF;--mute:#B1AEE6;--line:#4B49A0;--pink:#FF6B96;--cyan:#38D6E5;--good:#5BE08A;--bad:#FF8A8A;--amber:#FFC93C;--gold:#FFC93C;--btn:#FFC93C;--btnink:#17163A;--warn:#3D1F4F;--lt:#3A3320}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 17px/1.55 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:"Press Start 2P","Courier New",monospace;line-height:1.5;font-weight:400}
h1{font-size:clamp(22px,6vw,34px);margin:8px 0 18px}
h2{font-size:clamp(12px,3.3vw,15px);margin:6px 0 18px}
h3{font-size:12px;margin:22px 0 10px}
main{max-width:720px;margin:0 auto;padding:14px 16px 40px}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0 8px;border-bottom:2px solid var(--line);margin-bottom:16px}
.map{position:relative;height:58px;margin:0 6px 4px}
.track{position:absolute;left:0;right:0;bottom:18px;height:6px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 16px)}
.nd{position:absolute;bottom:0;transform:translateX(-50%);font-size:18px;line-height:1}
.av{position:absolute;bottom:22px;transform:translateX(-50%);transition:left 1.2s steps(12)}
.av .em{display:block;font-size:30px;line-height:1;animation:bob .8s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.stat{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;font-size:13px;font-weight:700;margin:2px 0}
.stat.n{color:var(--gold);font-size:14px;grid-template-columns:150px 1fr 110px}
.bar{height:10px;background:var(--panel);border:2px solid var(--line)}
.bar i{display:block;height:100%;width:0;transition:width .6s steps(8)}
.stat b{text-align:right;font-variant-numeric:tabular-nums}
.sep{font-size:12px;font-weight:800;color:var(--mute);margin:4px 0 0}
.card{background:var(--panel);border:2px solid var(--line);padding:16px;margin:14px 0;box-shadow:4px 4px 0 var(--line)}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--panel);color:var(--ink);border:2px solid var(--line);padding:12px 14px;margin:10px 0;font:inherit;cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.opt:hover{border-color:var(--pink)}
.opt .k{font-family:"Press Start 2P",monospace;font-size:12px;color:var(--pink);padding-top:4px;flex:none}
.opt[disabled]{cursor:default;opacity:.55}
.opt.sel{opacity:1;border-color:var(--pink)}
.go{background:var(--btn);color:var(--btnink);border:0;padding:14px 20px;font:400 12px "Press Start 2P",monospace;cursor:pointer;box-shadow:4px 4px 0 var(--line);margin:10px 8px 0 0}
.go[disabled]{opacity:.4;cursor:default}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.chip{display:inline-block;font-weight:800;font-size:14px;padding:2px 9px;border:2px solid currentColor;margin:3px 6px 3px 0}
.up{color:var(--good)}.dn{color:var(--bad)}.nt{color:var(--gold)}
.ty{font-family:"Press Start 2P",monospace;font-size:11px;line-height:1.6;margin:0 0 10px}
.fact{border-left:6px solid var(--cyan);padding:4px 0 4px 12px;margin:14px 0}
.fact b{color:var(--cyan)}
.loss{background:var(--warn);border:2px solid var(--bad);padding:8px 12px;margin:12px 0}
.loss b{color:var(--bad)}
.lr{background:var(--bg);border:2px solid var(--line);padding:8px 12px;margin:12px 0}.lr b{color:var(--cyan)}
.lt{background:var(--lt);border:2px solid var(--amber);padding:8px 12px;margin:12px 0}
.lt b{color:var(--amber)}
textarea,input[type=text]{width:100%;background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:10px;font:inherit}
textarea{min-height:70px;resize:vertical}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:var(--panel);color:var(--ink);border:2px solid var(--line);padding:8px 12px;font:700 15px "Nunito",sans-serif;cursor:pointer}
.pill.sel{background:var(--pink);border-color:var(--pink);color:#fff}
.cmp{display:grid;grid-template-columns:130px 1fr 120px;gap:8px;align-items:center;font-weight:700;margin:8px 0}
.cmp .bar{height:20px}
.small{font-size:14px;color:var(--mute)}
.tag{color:var(--mute);font-weight:700;margin:0}
a{color:var(--cyan)}
ul{padding-left:20px}
@media (max-width:520px){.stat,.stat.n{grid-template-columns:104px 1fr 30px;font-size:12px}.stat.n{grid-template-columns:104px 1fr 96px}.cmp{grid-template-columns:90px 1fr 92px;font-size:14px}}
@media (prefers-reduced-motion:reduce){.bar i,.av{transition:none}.av .em{animation:none}}
</style>
</head>
<body>
<main>
<div id="hud" class="hud" hidden></div>
<div id="app"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const ST=[["cre","Creatividad","#FF5C8A"],["cri","Pensamiento crítico","#2AB7C6"],["tec","Dominio técnico","#E0A800"],["eq","Trabajo en equipo","#3DBE6B"]];
const NAME={cre:"Creatividad",cri:"Pensamiento crítico",tec:"Dominio técnico",eq:"Trabajo en equipo"};
const RULES=["Sin IA","IA solo después de intentarlo yo","IA como coach, yo decido"];
const PRE=["No la he usado","La usé solo después de intentarlo yo","La usé como coach o para revisar lo que yo hice","La usé para generar partes importantes del trabajo","La usé para hacer casi todo"];
const QS=["¿En qué momento sentí ganas de delegar el pensamiento en la IA? ¿Qué lo provocó: plazo, miedo, cansancio?","¿Cuál de mis habilidades quiero proteger más y cómo?","Para lo que queda del semestre, ¿a qué me comprometo en concreto con mi uso de la IA?","¿Qué quisieras decirle o recomendarle al profesor sobre el uso de la IA en su clase?"];
const TY={1:["Ruta alineada con el informe","good"],2:["Ruta parcialmente alineada","amber"],3:["Ruta delegada a la IA","bad"]};
const M=[
{e:"🧱",t:"Misión 1: Nivel en el editor de Baba Is You",d:[
{q:"Tu nivel está armado, pero ya no puedes verlo como un jugador nuevo. Entregas en dos días y te da miedo que sea injugable o demasiado fácil y que eso baje tu nota.",fact:"Los estudiantes le contaron al comité que la tentación de dejar que la IA piense por ellos es mayor cuando temen no llegar a una fecha límite. El informe llama “rendición cognitiva” a recurrir a la IA al primer indicio de dificultad.|Aquí tienes plazo, miedo a la nota y una tarea difícil: verlo como un jugador nuevo. Es la combinación en la que, según el informe, cuesta más decidir con calma. No dice que usar IA sea malo, sino que se vuelva el reflejo ante la dificultad.",o:[
{y:2,g:"-+-",t:"Describo el nivel a la IA para que estime su dificultad y luego lo juego yo una vez, para llegar a la entrega con una segunda opinión.",r:"Ahorraste tiempo y la estimación fue razonable. Pero tu partida solo confirmó lo que ya sabías, y nunca viste a un novato trabarse.",lt:"Seguirás sin poder calibrar la dificultad por ti mismo en los próximos niveles.",s:{tec:5,cri:-6,eq:-3},n:4.3},
{y:3,t:"Le pido a la IA que resuelva el nivel y me diga si está bien, porque con dos días no quiero apostar solo a mi intuición.",r:"Dijo que estaba bien, con total seguridad. Entregaste tranquilo.",loss:"Imaginar la mirada de un jugador novato es una habilidad central de diseño. Delegaste esa perspectiva.",s:{cri:-10,cre:-6,tec:-5},n:4.2},
{y:1,t:"Pido a dos compañeros que jueguen el nivel y observo dónde se traban, aunque me da pena que vean algo que aún no está pulido.",r:"Uno se trabó en un punto que nunca imaginaste. Rediseñaste esa zona entendiendo por qué fallaba. Costó tiempo y orgullo, pero ahora ves tu nivel con ojos de jugador.",lrn:"Aprendiste a mirar tu propio diseño desde afuera, una habilidad que te acompaña en cada proyecto.",s:{cri:9,eq:7,tec:5},n:3.8},{y:1,t:"Grabo mi pantalla jugando como si fuera la primera vez y luego le pido a la IA preguntas sobre mis momentos de duda, para ver mis tropiezos antes de entregar.",r:"Al ver la grabación notaste dos momentos donde ni tú sabías qué hacer. Las preguntas de la IA te obligaron a explicar qué querías enseñar, y lo resolviste tú.",lrn:"Usaste la IA para interrogar tu criterio, no para sustituirlo.",n:4.6},{y:2,g:"-++",t:"Le pido a un compañero que lo juegue y uso la IA para resumir sus comentarios y decidir qué cambiar primero, porque casi no tengo tiempo.",r:"El resumen fue claro y priorizaste bien. Pero la IA suavizó el comentario más duro, justo el que más te habría enseñado.",lt:"Se pierde el matiz de lo que dice una persona real al ver tu diseño.",n:4.2},{y:3,t:"Pido a la IA varias versiones del nivel con distinta dificultad y elijo la que mejor se ve, para cubrirme de un posible desajuste.",r:"Una versión se veía perfecta y la entregaste. No sabes por qué es fácil o difícil.",loss:"Elegir entre versiones ajenas no es calibrar dificultad: te saltaste diseñar y probar.",n:4.3}]},
{q:"Quieres que el nivel enseñe una regla sin explicarla. No sabes cómo, el tiempo se acaba y los niveles de otros compañeros se ven muy pulidos.",fact:"El informe explica que, con agendas muy cargadas, automatizar es lo más eficiente, pero así los estudiantes se pierden la fricción cognitiva y la lucha productiva que hacen falta para aprender de verdad.|Descubrir cómo enseñar una regla sin explicarla pide probar, fallar y rediseñar. Esa fricción es la que el informe quiere proteger, aunque sea lo más lento.",o:[
{y:3,t:"Pido a la IA que rediseñe el inicio de mi nivel para que enseñe la regla, porque los niveles de otros compañeros se ven muy pulidos y no quiero quedar atrás.",r:"El inicio quedó elegante y se ve como los mejores de la clase.",loss:"No pasaste por los intentos fallidos que enseñan por qué una regla se entiende. Tienes el resultado, no el criterio.",s:{cre:-10,cri:-8,tec:-5},n:4.5},
{y:1,t:"Estudio cómo el juego original enseña sus reglas y rediseño mi inicio probándolo con alguien, aunque eso me deje menos tiempo para el resto del nivel.",r:"Fue la tercera versión la que funcionó. Costó una noche y el resto del nivel quedó más simple, pero entiendes por qué funciona, no solo que funciona.",lrn:"Entiendes la lógica detrás del diseño y puedes repetirla en otros niveles.",s:{tec:9,cri:7,cre:5},n:4.6},
{y:2,g:"-++",t:"Le pido a la IA principios de diseño de niveles, los aplico a mi inicio y pruebo con un compañero para ver si funcionan.",r:"Los principios ayudaron y tu compañero encontró un fallo. Pero tu esquema quedó muy parecido al de otros que usaron los mismos principios.",lt:"Tu estilo propio tarda más en aparecer cuando partes de recetas ya hechas.",s:{tec:6,eq:4,cre:-7},n:4.1},{y:1,t:"Pruebo mi inicio con un compañero y reviso cómo enseña el juego original; después le pido a la IA una crítica y decido yo qué aceptar.",r:"Aceptaste una de sus tres críticas y rechazaste dos con argumentos propios. Tu inicio cambió y sabes explicar por qué.",lrn:"Usaste la IA como contrapunto, y la decisión de diseño siguió siendo tuya.",n:4.1},{y:2,g:"+-+",t:"Le pido a la IA un esquema paso a paso para enseñar la regla y lo adapto a mi nivel con mis propios elementos.",r:"El esquema funcionó y avanzaste rápido. Pero tu nivel terminó con la misma estructura que otros que pidieron lo mismo.",lt:"Dejas de ensayar tus propias soluciones antes de recibir las ajenas.",n:4.2},{y:3,t:"Le pido a la IA que construya el nivel completo con la regla enseñada y me encargo yo de los colores y la presentación, para que se vea bien.",r:"Quedó prolijo, con una curva de dificultad impecable, y sobró tiempo.",loss:"No pasaste por los errores que enseñan por qué una regla se entiende. El nivel es perfecto y tú no aprendiste a diseñarlo.",n:4.5}]}]},
{e:"🕹️",t:"Misión 2: Prototipo de juego físico retro",d:[
{q:"Elegiste los años 80 y casi no sabes nada de esa época. Hay poco tiempo y te da pena preguntarle cosas básicas a otras personas.",fact:"El informe recuerda que los modelos de lenguaje pueden inventar datos y citas, que quien usa IA debe saber verificar sus resultados, y que el estudiante responde por todo lo que entrega.|Investigar una época que casi no conoces es donde un dato inventado pasa más fácil, porque no tienes con qué notarlo. Por eso importa saber de dónde sale cada cosa que entra a tu prototipo.",o:[
{y:1,t:"Busco fuentes y manuales de la época y hablo con alguien que jugó entonces, aunque me dé pena preguntar cosas básicas.",r:"Encontraste un manual de 1984 y anécdotas imposibles de inventar. Costó dos tardes, pero tu base es sólida: sabes de dónde sale cada dato.",lrn:"Aprendiste a rastrear el origen de cada dato, útil en cualquier investigación.",s:{cri:9,cre:7,eq:5},n:4.1},
{y:3,t:"Pido a la IA un informe de la época con juegos y mecánicas típicas, con referencias, para ahorrar tiempo y no tener que preguntar cosas básicas.",r:"El informe se ve completo y bien organizado. Incluye un juego que nunca existió.",loss:"El informe advierte que los modelos inventan datos y que tú respondes por ellos. Aquí no pusiste ningún filtro propio.",s:{cri:-10,cre:-8,eq:-4},n:3.8},
{y:2,g:"+--",t:"Uso un resumen de la IA como punto de partida y reviso a fondo dos o tres datos para ganar confianza en lo demás.",r:"De los tres que verificaste, uno era inventado y sonaba muy plausible. Del resto no sabes.",lt:"Lo que no verificaste ahora forma parte de lo que “sabes”.",s:{cri:3,cre:-6,tec:-3},n:4.5},{y:1,t:"Le pido a la IA una lista de preguntas para investigar la época y respondo cada una yo con manuales y entrevistas.",r:"La lista mostró huecos en lo que creías saber. Buscaste cada respuesta en manuales y entrevistas. Tomó tiempo, pero cada dato tiene fuente.",lrn:"Usaste la IA para guiar tu investigación, no para reemplazarla.",n:4.3},{y:2,g:"-+-",t:"Le pido a la IA que resuma un par de fuentes que ya encontré y leo el resumen para ahorrar horas.",r:"Ahorraste horas. Pero dos matices importantes de una fuente nunca los leíste, y tu prototipo los contradice.",lt:"Dejas de leer con atención incluso lo que sí encontraste tú.",n:4.0},{y:3,t:"Pido a la IA que escriba la contextualización histórica de mi prototipo, con referencias, y la incorporo a mi documento.",r:"El texto es elegante y trae referencias. Dos de ellas no existen.",loss:"No verificaste nada y presentaste como propio un conocimiento que no tienes.",n:3.8}]},
{q:"Mañana es el playtest y las reglas de tu prototipo son confusas. Te da miedo que se note y que te evalúen mal.",fact:"El informe advierte que la IA está desplazando el aprendizaje social, y que aprender con otras personas enseña a comunicar ideas, recibir críticas y ganar confianza. También dice que el conocimiento se construye con fricción, como ajustar algo una y otra vez hasta que funciona.|Ver a una persona real confundirse con tus reglas es justo esa clase de aprendizaje. Una IA puede señalar huecos, pero no reemplaza esa experiencia.",o:[
{y:2,g:"-+-",t:"Le pido a la IA que busque huecos en mis reglas y corrijo yo lo que encuentre antes del playtest.",r:"Encontró dos casos límite reales y las reglas mejoraron. Pero el playtest solo confirmó lo que la IA ya había dicho; nunca viste a alguien confundirse.",lt:"Sigues sin ver a un jugador real confundido, que es lo que más enseña.",s:{tec:6,cri:3,eq:-6},n:4.0},
{y:1,t:"Hago un playtest hoy con amigos, sin darles explicaciones, y tomo notas para reescribir yo mismo las reglas, aunque me dé miedo que se note la confusión.",r:"Fue incómodo: nadie entendió el turno. Pero las nueve notas te mostraron dónde estaba cada confusión, y reescribiste las reglas sabiendo por qué.",lrn:"Aprendiste a detectar dónde se confunde un jugador real y a reparar la causa.",s:{eq:9,tec:7,cri:5},n:5.0},
{y:3,t:"Le pido a la IA que reescriba mis reglas para que queden claras, porque temo que se note que están confusas, y llevo esa versión al playtest.",r:"Reglas impecables. En el playtest no puedes explicar por qué existe la regla 4.",loss:"Escribir las reglas es diseñarlas. Al delegar la redacción delegaste decisiones que nunca tomaste.",s:{cri:-10,tec:-8,eq:-5},n:4.4},{y:1,t:"Le pido a la IA que actúe como alguien que nunca vio el juego y diga qué no entiende; luego pruebo las reglas con una persona real.",r:"La IA detectó tres dudas y la persona real, cinco, dos de ellas distintas. Entendiste el límite de la simulación y corregiste con ambas.",lrn:"Usaste la IA como ensayo, y la prueba real como juez.",n:3.9},{y:2,g:"++-",t:"Pruebo con amigos y le pido a la IA que reescriba solo las reglas que más confundieron.",r:"Se resolvieron las confusiones más claras. Pero las reescrituras suenan distinto al resto del manual.",lt:"Reescribir es diseñar: cada regla delegada es una decisión que no tomaste.",n:4.3},{y:3,t:"Subo mis reglas a la IA y le pido un manual profesional listo para imprimir, para que el playtest se vea bien.",r:"El manual se ve como el de un juego comercial. En el playtest no sabes responder las preguntas de los jugadores.",loss:"Las reglas que no escribiste no las entiendes, y sin entenderlas no puedes mejorarlas.",n:4.1}]}]},
{e:"🎬",t:"Misión 3: Videocrítica de tu juego favorito",d:[
{q:"Es tu juego favorito y te cuesta ser crítico con él. Tienes poco tiempo y miedo de decir algo “incorrecto” frente a los criterios de la clase.",fact:"El informe distingue aumentar de automatizar: la IA ayuda cuando mejora lo que hace una persona, y no ayuda cuando la reemplaza, porque se pierde el aprendizaje que venía de hacer el trabajo.|Una crítica es el ejercicio donde se entrena tu juicio sobre un juego. Si el análisis lo hace otra cosa, el video avanza, pero tu criterio no.",o:[
{y:3,t:"Pido a la IA un análisis con los criterios de la clase y lo uso como base de mi video, para no equivocarme con los criterios.",r:"El análisis es pulido y razonable, casi idéntico a cualquier reseña.",loss:"La crítica consiste en ver lo que otros no ven en lo que amas. Delegaste justo ese acto.",s:{cri:-12,cre:-8,tec:-3},n:4.0},
{y:2,g:"+--",t:"Escribo primero mi opinión y luego la comparo con un análisis de la IA para ver qué se me pasó.",r:"La IA señaló dos puntos útiles. En un tercero cambiaste de postura sin saber si fue por argumentos o por la autoridad del texto.",lt:"Con el tiempo te será más difícil sostener una postura propia.",s:{cri:4,cre:-6,tec:-2},n:4.4},
{y:1,t:"Rejuego el juego con los criterios en mano y grabo mis notas en voz alta antes de consultar otras opiniones.",r:"Descubriste problemas que no veías en 200 horas. Duele un poco ver así a tu juego favorito y te tomó la noche, pero el criterio ahora es tuyo.",lrn:"Construiste un criterio propio de análisis que puedes aplicar a cualquier juego.",s:{cri:10,cre:7,tec:5},n:3.9},{y:1,t:"Escribo mis observaciones tras rejugar y luego le pido a la IA que me diga qué criterios de la clase no usé.",r:"La IA mencionó dos criterios que habías ignorado. Volviste al juego con esa pregunta y viste algo nuevo.",lrn:"Usaste la IA para revisar tu cobertura, y el análisis siguió siendo tuyo.",n:4.5},{y:2,g:"--+",t:"Le pido a la IA ejemplos de cómo otros críticos analizan este juego y me inspiro en ellos para estructurar el mío.",r:"Los ejemplos aclararon cómo estructurar la crítica. Tu video terminó pareciéndose bastante a esas reseñas.",lt:"Te cuesta más encontrar tu propia voz crítica.",n:4.1},{y:3,t:"Pido a la IA la crítica completa con los criterios de la clase, porque no estoy seguro de qué decir, y la uso en mi video.",r:"Suena muy profesional. Casi nadie notaría que no es tuya.",loss:"No miraste el juego con ojo crítico: recitaste un análisis sin haberlo vivido.",n:4.4}]},
{q:"Se acerca la entrega, el video suena desorganizado y te piden defender tus argumentos en clase.",fact:"El informe sugiere evaluar con exámenes orales, portafolios y trabajos fuera de clase acompañados de conversación en clase, porque la IA puede producir un trabajo, pero no puede defenderlo por ti.|Te van a pedir defender tus argumentos frente a la clase. Ese momento muestra cuánto de tu video pensaste tú.",o:[
{y:1,t:"Reorganizo mi argumento con tarjetas, grabo varias tomas y ensayo la defensa con un compañero para llegar más seguro.",r:"Quedó con tu voz y tus imperfecciones, menos pulido que otros. En la defensa pudiste responder todo porque cada argumento fue tuyo.",lrn:"Practicaste estructurar y defender un argumento con tu propia voz.",s:{cri:9,eq:7,cre:5},n:4.4},
{y:3,t:"Le doy mis notas a la IA para que escriba el guion del video, porque me cuesta ordenar ideas y el tiempo se acaba, y lo leo a cámara.",r:"Suena fluido y profesional. En la defensa no puedes sostener un argumento.",loss:"Estructurar el argumento es pensar. El guion era la parte del trabajo que más lo exigía.",s:{cri:-10,cre:-8,eq:-4},n:3.9},

const steps=[{k:"pre"}];M.forEach((m,mi)=>{m.d.forEach((d,di)=>steps.push({k:"d",mi,di}));steps.push({k:"r",mi})});steps.push({k:"pred"});steps.push({k:"end"});

const TRI=[["cri","tec","eq"],["cre","cri","tec"],["cri","cre","eq"],["eq","tec","cre"],["cri","cre","tec"],["cri","tec","eq"]];
const HUM=["🧑","👩","👨","👧","👦","🧑‍💻","👩‍💻","👨‍💻","🧑‍🎨","🧑‍🎓","👩🏽","👨🏿","🧑🏾","🧔","👵","👴","🧑‍🚀","🧑‍🎤","👩‍🔬","👨‍🍳","🧑‍🏫","👩🏻‍🦰"],ANI=["🐱","🐶","🦊","🐼","🐸","🐵","🦁","🐯","🐨","🐰","🐙","🦉","🐧","🦄","🐢","🦖","🐻","🐷","🐮","🦝","🐺","🦔"];
const EMO=(a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a})([...(a=>{const b=a.slice();b.sort(()=>Math.random()-.5);return b.slice(0,10)})(HUM),...(a=>{const b=a.slice();b.sort(()=>Math.random()-.5);return b.slice(0,10)})(ANI)]);
const S={pre:null,preTxt:"",pred:"",ev:{},sel:[],emoji:EMO[0],i:-1,name:"",stats:{cre:50,cri:50,tec:50,eq:50},notes:[],ced:0,log:[],res:null,rule:{},why:{},fin:["","","",""]};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clamp=v=>Math.max(0,Math.min(100,v));

const avg=()=>Math.round(Object.values(S.stats).reduce((a,b)=>a+b,0)/4);
const nota=()=>S.notes.length?S.notes.reduce((a,b)=>a+b,0)/S.notes.length:0;
function hud(){const h=$("#hud");h.hidden=false;const ic=M.map((m,i)=>`<span class="nd" style="left:${2+i*28.67}%">${m.e}</span>`).join("");
h.innerHTML=`<div class="map" aria-label="Progreso del semestre"><div class="track"></div>${ic}<span class="nd" style="left:88%">🏁</span><div class="av" id="av" style="left:2%"></div></div><div class="stat n"><span>Nota en clase</span><div class="bar"><i id="b-n" style="background:#E0A800"></i></div><b id="v-n">Sin notas aún</b></div><p class="sep">Tus habilidades reales se revelan al final.</p>`;$("#av").innerHTML='<span class="em">'+S.emoji+'</span>'}
function prog(){let c=0;for(let j=0;j<S.i;j++)if(steps[j].k==="d")c++;if(S.res)c++;return c}
function upd(){const n=nota();$("#b-n").style.width=((n-1)/4*100)+"%";$("#v-n").textContent=lvN(n);$("#av").innerHTML='<span class="em">'+S.emoji+'</span>'}
function setEmo(e){S.emoji=e;document.querySelectorAll('.emo').forEach(b=>b.classList.toggle('sel',b.dataset.e===e))}
function go(){S.res=null;S.i++;render();window.scrollTo(0,0)}
function start(){S.name=$("#nm").value.trim();S.lo={};S.hi={};S.tc={};ST.forEach(([k])=>{S.lo[k]=2+Math.random()*1.5;S.hi[k]=4.5+Math.random()*.5;S.tc[k]={p:0,t:0}});S.sel=M.map((m,mi)=>m.d.map((d,di)=>shuf([1,2,3].map(y=>{const b=d.o.filter(o=>o.y===y),o=b[Math.floor(Math.random()*b.length)],sg=y===1?"+++":y===3?"---":o.g,s={};TRI[mi*2+di].forEach((k,i)=>s[k]=sg[i]==="+"?1:-1);return {...o,s}}))));hud();go()}
function pick(oi){const st=steps[S.i],d=M[st.mi].d[st.di],o=S.sel[st.mi][st.di][oi];const dl={};for(const k in o.s){const c=S.tc[k];c.t++;if(o.s[k]>0)c.p++;const nv=((S.lo[k]+(S.hi[k]-S.lo[k])*c.p/c.t)-1)/4*100;dl[k]=nv-S.stats[k];S.stats[k]=nv}S.notes.push(o.n);S.ced+=o.y-1;S.res={oi,dl};S.log.push({mi:st.mi,q:d.q,a:o.t,y:o.y,n:o.n,loss:o.loss||"",lt:o.lt||"",lrn:o.lrn||""});upd();render()}
function render(){const a=$("#app"),st=steps[S.i];

if(S.i<0){a.innerHTML=`<p class="tag">Un semestre en unos 6 minutos</p><h1>Level up o autoplay</h1><div class="card"><p>Tu personaje recorre tres tareas de esta clase. En cada una decides cómo usar (o no) la IA, con poco tiempo y presión real.</p><p>Durante el juego verás tu <b>nota en clase</b>. Tu <b>habilidad real</b> se revela al final.</p><p class="small">Esta experiencia fue creada usando Claude de Anthropic basado en las conclusiones del <a href="https://aiandeducation.mit.edu/report/" target="_blank" rel="noopener">informe del Comité Ad Hoc del MIT sobre uso de IA en enseñanza, aprendizaje y formación investigativa</a> del 13 de agosto de 2026.</p><p class="small">Nada se envía solo. Al final puedes descargar un PDF para tu profesor; lo leerá para conocerte mejor y no lo califica.</p></div><label for="nm" class="tag">Tu nombre de jugador</label><input id="nm" type="text" maxlength="60" placeholder="Opcional" autocomplete="off"><p class="tag" style="margin-top:14px">Elige tu personaje</p><div class="pills">${EMO.map(e=>`<button class="pill emo ${e===S.emoji?"sel":""}" data-e="${e}" onclick="setEmo('${e}')" aria-label="Personaje ${e}" style="font-size:24px">${e}</button>`).join("")}</div><br><button class="go" onclick="start()">Press start</button>`;return}
const m=st.mi!=null?M[st.mi]:null;
if(st.k==="d"){const d=m.d[st.di],r=S.res;

if(st.k==="r"){const ok=S.rule[st.mi]!=null;
a.innerHTML=`<p class="tag">${m.e} ${m.t} · pausa de reflexión</p><h2>Si tú fueras el profesor de esta tarea, ¿qué regla de IA pondrías?</h2><p class="small">El informe recomienda que toda política de IA explique su razón, ligada a lo que la tarea busca que aprendas.</p><div class="pills">${RULES.map((r,i)=>`<button class="pill ${S.rule[st.mi]===i?"sel":""}" onclick="S.rule[${st.mi}]=${i};render()">${r}</button>`).join("")}</div><h3>¿Por qué? (una frase)</h3><textarea oninput="S.why[${st.mi}]=this.value" placeholder="Ej.: porque la tarea busca que yo aprenda a…">${esc(S.why[st.mi]||"")}</textarea><br><button class="go" ${ok?"":"disabled"} onclick="go()">${st.mi<2?"Siguiente misión":"Llegar a la meta"}</button>`;return}
if(st.k==="pre"){a.innerHTML=`<p class="tag">Antes de jugar</p><h2>¿Cómo has usado la IA en las tareas que ya entregaste en esta clase?</h2><p class="small">Sé honesto. Tu profesor lo leerá para conocerte mejor y no lo califica.</p><div class="pills" style="flex-direction:column;align-items:stretch">${PRE.map((p,i)=>`<button class="pill ${S.pre===i?"sel":""}" style="text-align:left" onclick="S.pre=${i};render()">${p}</button>`).join("")}</div><br><button class="go" ${S.pre!=null?"":"disabled"} onclick="go()">Empezar el semestre</button>`;return}
if(st.k==="pred"){a.innerHTML=`<p class="tag">Antes de ver tus resultados</p><h2>Llegaste a la meta. ¿Qué nivel de habilidad real crees que desarrollaste en este recorrido?</h2><p class="small">Tu nota en clase ya la conoces. Ahora piensa en lo que aprendiste de verdad.</p><div class="pills">${["Bajo","Básico","Alto","Superior"].map(p=>`<button class="pill ${S.pred===p?"sel":""}" onclick="S.pred='${p}';render()">${p}</button>`).join("")}</div><br><button class="go" ${S.pred?"":"disabled"} onclick="go()">Revelar mis habilidades</button>`;return}
final()}
function rank(){const n=sc(avg());return n<3?["Jugador en modo espectador","El personaje avanzó, pero casi siempre jugó otro por él."]:n<4?["NPC con buenas intenciones","Hay potencial, pero varias veces dejaste que otro tomara las decisiones que más enseñaban."]:n<4.6?["Diseñador en entrenamiento","Vas bien, aunque cada atajo tuvo un costo que quizá aún no ves."]:["Maestro del game loop","Protegiste tu aprendizaje, incluso cuando era más lento o más incómodo."]}
function cnt(y){return S.log.filter(l=>l.y===y).length}
function final(){const real=avg(),rn=sc(real),nn=nota(),[rk,rt]=rank(),gap=nn-rn;
const msg=gap>1?"Tu nota es mucho más alta que tu habilidad real. Un profesor que solo ve las entregas vería a un estudiante sobresaliente, y tú sabes que no tuviste que enfrentarte a la dificultad que enseña. Esa diferencia es lo que realmente se pierde.":gap>0.4?"Tu nota va por encima de tu habilidad real. La brecha es el aprendizaje que cediste en el camino.":gap<-0.3?"Tu habilidad real supera tu nota. Lo que aprendiste no siempre se ve en la calificación, pero es lo que te queda.":"Tu nota y tu habilidad real van parejas.";
const cm=S.ced>=8?"Delegaste el pensamiento en la mayoría de las decisiones clave. Un semestre así deja entregas, pero casi ninguna habilidad nueva.":S.ced>=3?"Cediste el pensamiento en varios momentos importantes. Cada uno parecía razonable a esa hora; juntos pesan.":"Cediste poco del proceso de pensar. Aun así, mira lo que te costó hacerlo: tiempo, sueño, tranquilidad.";
const ls=S.log.filter(l=>l.loss),lt=S.log.filter(l=>l.lt),lr=S.log.filter(l=>l.lrn);
const Q=QS;
$("#app").innerHTML=`<p class="tag">${S.emoji} Meta alcanzada${S.name?" · "+esc(S.name):""}</p><h1>${rk}</h1><p>${rt}</p><div class="card"><div class="cmp"><span>Nota en clase</span><div class="bar"><i style="background:#E0A800;width:${(nn-1)/4*100}%"></i></div><b>${lvN(nn)}</b></div><div class="cmp"><span>Habilidad real</span><div class="bar"><i style="background:#3DBE6B;width:${real}%"></i></div><b>${lvN(rn)}</b></div><p>${msg}</p><p class="small">Tu predicción fue ${S.pred||"(sin respuesta)"}; tu habilidad real resultó ${lvN(rn)}.</p></div><div class="card"><h3 style="margin-top:0">Tus habilidades reales</h3>${ST.map(([k,n,c])=>`<div class="cmp"><span>${n}</span><div class="bar"><i style="background:${c};width:${S.stats[k]}%"></i></div><b>${lvl(S.stats[k])}</b></div>`).join("")}</div><div class="card"><p style="font-family:'Press Start 2P',monospace;font-size:12px;line-height:1.6">Tus rutas: ${cnt(1)} alineadas, ${cnt(2)} parciales, ${cnt(3)} delegadas</p><p class="small">Las rutas <b>alineadas</b> y <b>parciales</b> son las que siguen las recomendaciones del informe del MIT; las <b>delegadas</b> no.</p><p>Antes de jugar dijiste sobre tus entregas reales: <b>${PRE[S.pre]||"(sin respuesta)"}</b>.</p><p>${cm}</p>${ls.length?`<div class="loss"><b>Lo que no aprendiste en el camino:</b><ul>${ls.map(l=>`<li>${l.loss}</li>`).join("")}</ul></div>`:""}${lr.length?`<div class="lr"><b style="color:var(--good)">Lo que sí construiste:</b><ul>${lr.map(l=>`<li>${l.lrn}</li>`).join("")}</ul></div>`:""}${lt.length?`<div class="lt"><b>Consecuencias a largo plazo:</b><ul>${lt.map(l=>`<li>${l.lt}</li>`).join("")}</ul></div>`:""}</div><div class="fact"><b>La idea central del informe.</b> El proceso de aprender es una lucha productiva, y lo más valioso que produce tu educación no es una nota sino tú mismo. Cuando la IA hace la parte difícil, el trabajo avanza y tú no.</div><h3>Tus reglas de IA</h3><ul>${M.map((m,i)=>`<li><b>${m.t.split(": ")[1]}:</b> ${RULES[S.rule[i]]}. ${esc(S.why[i]||"")}</li>`).join("")}</ul><h3>Cuatro preguntas para cerrar</h3>${Q.map((q,i)=>`<p><b>${q}</b></p><textarea oninput="S.fin[${i}]=this.value">${esc(S.fin[i])}</textarea>`).join("")}<p><button class="go" onclick="dl()">Descargar resumen en PDF</button><button class="go" onclick="location.reload()">Jugar de nuevo</button></p><p class="small" id="note"></p><p class="small">Fuente: <a href="https://aiandeducation.mit.edu/report/" target="_blank" rel="noopener">Informe del Comité ad hoc del MIT sobre IA en enseñanza, aprendizaje y formación investigativa</a>.</p>`}

M.forEach((m,i)=>{t+=`\n### ${m.t}\n`+S.log.filter(l=>l.mi===i).map(l=>`- ${l.q}\n  Elegí: ${l.a}\n  Tipo de ruta: ${TL[l.y]}. Nota de la entrega: ${lvN(l.n)}${l.loss?"\n  Lo que dejé de aprender: "+l.loss:""}${l.lt?"\n  Efecto a largo plazo: "+l.lt:""}`).join("\n")+`\n- Regla de IA que pondría: ${RULES[S.rule[i]]}\n- Porque: ${S.why[i]||"(sin respuesta)"}\n`});

function pdfBlob(){const d=new window.jspdf.jsPDF({unit:"pt",format:"letter"});const Mg=48,TW=516;let y=Mg;

const B=(lab,fr,col,tx)=>{if(y>725){d.addPage();y=Mg}d.setFont("helvetica","bold");d.setFontSize(11);d.setTextColor(27,26,68);d.text(lab,Mg,y);d.setDrawColor(120);d.rect(Mg+120,y-10,240,12);d.setFillColor(...col);d.rect(Mg+120,y-10,240*Math.max(0,Math.min(1,fr)),12,"F");d.text(cl(tx),Mg+370,y);y+=20};

T("Level up o autoplay: resumen de mi partida",18,true,8);
T("Jugador: "+(S.name||"(sin nombre)"),12,false,2);T("Rango: "+rank()[0],12,true,10);
B("Nota en clase",(nota()-1)/4,[224,168,0],lvN(nota()));B("Habilidad real",real/100,[61,190,107],lvN(sc(real)));y+=4;
T(S.ced>=8?"Delegué el pensamiento en la mayoría de las decisiones clave.":S.ced>=3?"Cedí el pensamiento en varios momentos importantes.":"Cedí poco del proceso de pensar.",11,false,2);
T("Rutas: "+cnt(1)+" alineadas, "+cnt(2)+" parciales, "+cnt(3)+" delegadas. Pensamiento cedido: "+S.ced+" de 12.",11,true,2);T("Las rutas alineadas y parciales son las que siguen las recomendaciones del informe del MIT; las delegadas no.",9,false,4);T("Sobre mis entregas reales dije: "+(PRE[S.pre]||"(sin respuesta)"),10,false,2);T("Mi predicción de habilidad real: "+(S.pred||"(sin respuesta)"),10,false,10);
T("Habilidades finales (escala 1.0 a 5.0)",13,true,2);ST.forEach(([k,n,c])=>B(n,S.stats[k]/100,[42,42,107],lvl(S.stats[k])));y+=6;
M.forEach((m,i)=>{T(m.t,13,true,2);T("Regla de IA que pondría: "+RULES[S.rule[i]],10,true,1);T("Porque: "+(S.why[i]||"(sin respuesta)"),10,false,10)});
T("Reflexión final",13,true,2);QS.forEach((q,i)=>{T(q,10,true,1);T(S.fin[i]||"(sin respuesta)",10,false,6)});
T("Basado en el informe del Comité sobre uso de IA del MIT (agosto de 2026): aiandeducation.mit.edu/report",9,false,0);
return d.output("blob")}
async function dl(){const n=$("#note");let blob;try{blob=pdfBlob()}catch(e){n.innerHTML="No se pudo generar el PDF (revisa tu conexión). Copia tu resumen:<textarea readonly onclick=\"this.select()\" style=\"min-height:180px\">"+esc(summary())+"</textarea>";return}
